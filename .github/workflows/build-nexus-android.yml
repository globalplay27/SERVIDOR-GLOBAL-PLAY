name: Build NEXUS AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/nexus_app/**"
      - ".github/workflows/build-nexus-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: apps/nexus_app
        run: flutter create --platforms=android .

      - name: Grant Android internet permission
        working-directory: apps/nexus_app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace("<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">", "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    " + permission)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Install dependencies
        working-directory: apps/nexus_app
        run: flutter pub get

      - name: Remove generated sample test
        working-directory: apps/nexus_app
        run: rm -f test/widget_test.dart

      - name: Analyze
        working-directory: apps/nexus_app
        run: flutter analyze

      - name: Build release APK
        working-directory: apps/nexus_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-Android
          path: apps/nexus_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
