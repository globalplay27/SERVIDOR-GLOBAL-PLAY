name: Diagnose Nexus Media Provider Bindings

on:
  push:
    branches:
      - feature/nexus-app-v2-20260924
    paths:
      - ".github/workflows/diag-nexus-media-provider-bindings.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Worker binding names only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          account_id=$(node -e 'const d=JSON.parse(process.argv[1]); const r=d.result||[]; if(!d.success||r.length!==1)process.exit(2); process.stdout.write(r[0].id)' "$response")
          settings=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/servidor-nexus/settings")
          node - <<'NODE' "$settings"
          const d=JSON.parse(process.argv[2]);
          if(!d.success) process.exit(2);
          const rows=(d.result?.bindings||[]).map(b=>({name:b.name,type:b.type}));
          console.log(JSON.stringify(rows,null,2));
          NODE
