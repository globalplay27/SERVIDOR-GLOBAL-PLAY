name: NEXUS migration patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexus-migration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration safety fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          server_path = Path('server.js')
          server = server_path.read_text()
          pattern = re.compile(r'function clientVideoBridge\(clientId\) \{\n  const clients = loadClients\(\);\n  if \(clientId === "ragnar-one"\) \{.*?\n  \}\n\n  // Global Play', re.S)
          replacement = '''function clientVideoBridge(clientId) {
            const clients = loadClients();
            // Ragnar é isolado: sem chave OpenAI própria, falha localmente e nunca retorna ao agente antigo.
            if (clientId === "ragnar-one") return null;

            // Global Play'''
          server_new, count = pattern.subn(replacement, server, count=1)
          if count != 1:
              raise SystemExit(f'clientVideoBridge patch count={count}')
          server_path.write_text(server_new)

          client_path = Path('public/client.js')
          client = client_path.read_text()
          if 'function clientHasVideoTools(' not in client:
              marker = 'function showView(name){'
              helper = '''function clientHasVideoTools(client=currentClient){const niche=String(client?.niche||"").trim().toLowerCase();return niche.includes("streaming")||niche.includes("iptv");}\n'''
              if marker not in client:
                  raise SystemExit('showView marker missing')
              client = client.replace(marker, helper + 'function showView(name){if((name==="videos"||name==="trailers")&&!clientHasVideoTools())name="overview";', 1)
          else:
              raise SystemExit('clientHasVideoTools already exists; refusing duplicate patch')

          render_marker = 'function renderClient(c){\n  currentClient=c;\n'
          render_insert = '''function renderClient(c){
            currentClient=c;
            const videoTools=clientHasVideoTools(c);
            ["videos","trailers"].forEach(view=>{
              const button=document.querySelector('[data-view="'+view+'"]');
              const panel=document.querySelector('#view-'+view);
              if(button)button.hidden=!videoTools;
              if(panel&&!videoTools)panel.hidden=true;
            });
'''
          if render_marker not in client:
              raise SystemExit('renderClient marker missing')
          client = client.replace(render_marker, render_insert, 1)
          client_path.write_text(client)
          PY

          node --check server.js
          node --check public/client.js
      - name: Commit validated fixes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "NEXUS Migration Bot"
          git config user.email "nexus-migration@users.noreply.github.com"
          rm .github/workflows/nexus-migration-patch.yml
          git add server.js public/client.js .github/workflows/nexus-migration-patch.yml
          git commit -m "Finish Ragnar migration safeguards and niche video gating"
          git push origin main
