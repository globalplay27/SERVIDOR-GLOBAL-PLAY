name: Nexus publish Work test images

on:
  push:
    branches:
      - feature/nexus-app-v2-20260924
    paths:
      - ".github/workflows/nexus-publish-work-images.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared creatives
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/global.jpg "https://cdn.creativeclaw.co/u/9ffaeee4/images/a95a1a3c-1e8a-443c-94d5-e8c51393b488.jpg"
          curl -fL --retry 3 -o /tmp/ragnar.jpg "https://cdn.creativeclaw.co/u/9ffaeee4/images/e8833549-e78c-4451-8514-e0a775629829.jpg"
          file /tmp/global.jpg /tmp/ragnar.jpg

      - name: Publish Global Play test image
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -H "Content-Type: image/jpeg"             --data-binary @/tmp/global.jpg             "https://servidor-nexus.diamantehinode2015.workers.dev/api/internal/work-image-test?k=98f21e484c77cc043dde0c662327a1c3a2f26c6d4a2a35d7&clientId=globalplay-streaming"             -o /tmp/global-result.json
          cat /tmp/global-result.json
          node -e 'const d=require("/tmp/global-result.json"); if(!d.ok) process.exit(2); console.log("GLOBAL_OK", d.post?.mediaId||"", d.permalink||"");'

      - name: Publish Ragnar One test image
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -H "Content-Type: image/jpeg"             --data-binary @/tmp/ragnar.jpg             "https://servidor-nexus.diamantehinode2015.workers.dev/api/internal/work-image-test?k=98f21e484c77cc043dde0c662327a1c3a2f26c6d4a2a35d7&clientId=ragnar-one"             -o /tmp/ragnar-result.json
          cat /tmp/ragnar-result.json
          node -e 'const d=require("/tmp/ragnar-result.json"); if(!d.ok) process.exit(2); console.log("RAGNAR_OK", d.post?.mediaId||"", d.permalink||"");'
