name: NEXUS Video Template Render

on:
  repository_dispatch:
    types: [video-template-render]

concurrency:
  group: nexus-video-render-${{ github.event.client_payload.clip_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_ID: ${{ github.event.client_payload.job_id }}
      CLIP_ID: ${{ github.event.client_payload.clip_id }}
      CLIENT_ID: ${{ github.event.client_payload.client_id }}
      CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
      START_SECONDS: ${{ github.event.client_payload.start }}
      END_SECONDS: ${{ github.event.client_payload.end }}
      TITLE: ${{ github.event.client_payload.title }}
      INTRO_TEXT: ${{ github.event.client_payload.intro_text }}
      END_TEXT: ${{ github.event.client_payload.end_text }}
      END_CONTACT: ${{ github.event.client_payload.end_contact }}
      SUBTITLE_CUES: ${{ toJSON(github.event.client_payload.subtitle_cues) }}
      NEXUS_BASE_URL: https://servidor-nexus.diamantehinode2015.workers.dev

    steps:
      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Download original source from R2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 --retry-all-errors \
            "$NEXUS_BASE_URL/api/internal/video-render/source" \
            -H "x-nexus-job-id: $JOB_ID" \
            -H "x-nexus-clip-id: $CLIP_ID" \
            -H "x-nexus-client-id: $CLIENT_ID" \
            -H "x-nexus-callback-token: $CALLBACK_TOKEN" \
            -o /tmp/source.mp4
          test -s /tmp/source.mp4

      - name: Build reference subtitles and text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, textwrap

          start=float(os.getenv("START_SECONDS","0") or 0)
          end=float(os.getenv("END_SECONDS","30") or 30)
          dur=max(1.0,end-start)

          def clean(s):
              return " ".join(str(s or "").replace("\n"," ").replace("\r"," ").split())

          def ass_time(sec):
              sec=max(0.0,float(sec))
              h=int(sec//3600); sec-=h*3600
              m=int(sec//60); sec-=m*60
              return f"{h}:{m:02d}:{sec:05.2f}"

          def ass_escape(s):
              s=clean(s).replace("\\","\\\\").replace("{","\\{").replace("}","\\}")
              lines=textwrap.wrap(s,28)[:2]
              return r"\N".join(lines)

          try:
              cues=json.loads(os.getenv("SUBTITLE_CUES","[]") or "[]")
          except Exception:
              cues=[]

          with open("/tmp/subtitles.ass","w",encoding="utf-8") as f:
              f.write("""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2

          [V4+ Styles]
          Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding
          Style: Default,DejaVu Sans,46,&H0000D6FF,&H0000D6FF,&H00000000,&H99000000,-1,0,0,0,100,100,0,0,3,2,0,2,90,90,430,1

          [Events]
          Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text
          """)
              for cue in cues:
                  cs=max(0.0,float(cue.get("start",start))-start)
                  ce=min(dur,float(cue.get("end",end))-start)
                  text=ass_escape(cue.get("text",""))
                  if text and ce>cs:
                      f.write(f"Dialogue: 0,{ass_time(cs)},{ass_time(ce)},Default,,0,0,0,,{text}\n")

          intro=clean(os.getenv("INTRO_TEXT") or os.getenv("TITLE") or "")[:90]
          outro=" • ".join(x for x in [
              clean(os.getenv("TITLE",""))[:70],
              clean(os.getenv("END_TEXT",""))[:70],
              clean(os.getenv("END_CONTACT",""))[:70]
          ] if x)[:180]
          with open("/tmp/intro.txt","w",encoding="utf-8") as f:
              f.write("\n".join(textwrap.wrap(intro,28)[:2]))
          with open("/tmp/outro.txt","w",encoding="utf-8") as f:
              f.write("\n".join(textwrap.wrap(outro,30)[:2]))
          PY

      - name: Render approved NEXUS reference
        shell: bash
        run: |
          set -euo pipefail
          DURATION="$(python - <<'PY'
          import os
          s=float(os.getenv("START_SECONDS","0") or 0)
          e=float(os.getenv("END_SECONDS","30") or 30)
          print(max(1.0,min(60.0,e-s)))
          PY
          )"
          OUTRO_START="$(python - <<PY
          d=float("$DURATION")
          print(max(0.0,d-2.5))
          PY
          )"
          BOLD="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          ffmpeg -y -ss "$START_SECONDS" -i /tmp/source.mp4 -t "$DURATION" \
            -filter_complex "[0:v]split=2[bg][fg];[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=20:10[bg2];[fg]scale=1080:1920:force_original_aspect_ratio=decrease[fg2];[bg2][fg2]overlay=(W-w)/2:(H-h)/2,format=yuv420p[base];[base]ass=/tmp/subtitles.ass[subbed];[subbed]drawbox=x=iw*0.08:y=ih*0.08:w=iw*0.84:h=ih*0.09:color=black@0.65:t=fill:enable='between(t,0,2.5)'[introbg];[introbg]drawtext=fontfile=$BOLD:textfile=/tmp/intro.txt:fontcolor=white:fontsize=40:borderw=2:bordercolor=black:x=(w-text_w)/2:y=ih*0.11:fix_bounds=1:enable='between(t,0,2.5)'[intro];[intro]drawbox=x=0:y=ih*0.72:w=iw:h=ih*0.28:color=black@0.75:t=fill:enable='gte(t,$OUTRO_START)'[outrobg];[outrobg]drawtext=fontfile=$BOLD:textfile=/tmp/outro.txt:fontcolor=white:fontsize=42:borderw=2:bordercolor=black:x=(w-text_w)/2:y=h*0.82-text_h/2:fix_bounds=1:enable='gte(t,$OUTRO_START)'[outv]" \
            -map "[outv]" -map 0:a? -r 30 -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart /tmp/rendered.mp4
          test -s /tmp/rendered.mp4

      - name: Upload rendered clip to NEXUS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 --retry-all-errors \
            -X PUT "$NEXUS_BASE_URL/api/internal/video-render/upload" \
            -H "x-nexus-job-id: $JOB_ID" \
            -H "x-nexus-clip-id: $CLIP_ID" \
            -H "x-nexus-client-id: $CLIENT_ID" \
            -H "x-nexus-callback-token: $CALLBACK_TOKEN" \
            -H "content-type: video/mp4" \
            --data-binary "@/tmp/rendered.mp4"

      - name: Report render failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          curl --silent --show-error \
            -X POST "$NEXUS_BASE_URL/api/internal/video-render/fail" \
            -H "x-nexus-job-id: $JOB_ID" \
            -H "x-nexus-clip-id: $CLIP_ID" \
            -H "x-nexus-client-id: $CLIENT_ID" \
            -H "x-nexus-callback-token: $CALLBACK_TOKEN" \
            -H "content-type: application/json" \
            --data '{"error":"github_template_render_failed"}'
