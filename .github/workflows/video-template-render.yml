name: NEXUS Video Template Render

on:
  repository_dispatch:
    types: [video-template-render]

concurrency:
  group: nexus-video-render-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JOB_ID: ${{ github.event.client_payload.job_id }}
      CLIENT_ID: ${{ github.event.client_payload.client_id }}
      CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
      TITLE: ${{ github.event.client_payload.render.title }}
      OVERVIEW: ${{ github.event.client_payload.render.overview }}
      RELEASE_YEAR: ${{ github.event.client_payload.render.year }}
      MEDIA_TYPE: ${{ github.event.client_payload.render.media_type }}
      MOVIE_METADATA: ${{ toJSON(github.event.client_payload.render.metadata) }}
      POSTER_URL: ${{ github.event.client_payload.render.poster_url }}
      LOGO_ENABLED: ${{ github.event.client_payload.render.logo_enabled }}
      REQUESTED_DURATION: ${{ github.event.client_payload.render.duration }}
      EDIT_STYLE: ${{ github.event.client_payload.render.edit_style }}
      END_TEXT: ${{ github.event.client_payload.render.end_text }}
      END_CONTACT: ${{ github.event.client_payload.render.end_contact }}
      NEXUS_BASE_URL: https://servidor-nexus.diamantehinode2015.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Prepare render dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          fi
          python3 -c "from PIL import Image, ImageDraw, ImageFont" >/dev/null 2>&1 || python3 -m pip install --quiet pillow

      - name: Download source from R2 through NEXUS
        shell: bash
        run: |
          set -euo pipefail
          echo source_download_failed > /tmp/nexus-render-error.txt
          curl --fail-with-body --retry 2 --retry-all-errors \
            "$NEXUS_BASE_URL/api/internal/video-render/source" \
            -H "x-nexus-job-id: $JOB_ID" -H "x-nexus-client-id: $CLIENT_ID" \
            -H "x-nexus-callback-token: $CALLBACK_TOKEN" -o /tmp/source.mp4
          test -s /tmp/source.mp4

      - name: Prepare poster and typography
        shell: bash
        run: |
          set -euo pipefail
          echo poster_preparation_failed > /tmp/nexus-render-error.txt
          if [ -n "$POSTER_URL" ]; then
            if [[ "$POSTER_URL" == "$NEXUS_BASE_URL/media/"* ]]; then
              curl --fail --max-time 20 "$NEXUS_BASE_URL/api/internal/video-render/poster" \
                -H "x-nexus-job-id: $JOB_ID" \
                -H "x-nexus-client-id: $CLIENT_ID" \
                -H "x-nexus-callback-token: $CALLBACK_TOKEN" -o /tmp/poster.jpg
            else
              curl -L --fail --max-time 20 "$POSTER_URL" -o /tmp/poster.jpg
            fi
          fi
          if [ "$LOGO_ENABLED" = "true" ]; then
            curl --fail-with-body --retry 2 --retry-all-errors \
              "$NEXUS_BASE_URL/api/internal/video-render/logo" \
              -H "x-nexus-job-id: $JOB_ID" \
              -H "x-nexus-client-id: $CLIENT_ID" \
              -H "x-nexus-callback-token: $CALLBACK_TOKEN" \
              -o /tmp/logo-input || rm -f /tmp/logo-input
            if [ -s /tmp/logo-input ]; then
              ffmpeg -y -i /tmp/logo-input -vf "scale=120:120:force_original_aspect_ratio=decrease,pad=120:120:(ow-iw)/2:(oh-ih)/2:color=black@0" /tmp/logo.png >/dev/null 2>&1 || rm -f /tmp/logo.png
            fi
          fi
          python - <<'PY'
          import os, textwrap
          def clean(value):
              return " ".join((value or "").replace("\n"," ").replace("\r"," ").split())
          title=clean(os.getenv("TITLE","Conteúdo"))[:100]
          overview=clean(os.getenv("OVERVIEW",""))[:600]
          year=clean(os.getenv("RELEASE_YEAR",""))
          media=clean(os.getenv("MEDIA_TYPE","")).upper()
          end_text=clean(os.getenv("END_TEXT",""))
          end_contact=clean(os.getenv("END_CONTACT",""))
          with open("/tmp/title.txt","w",encoding="utf-8") as f:
              f.write("\n".join(textwrap.wrap(title, 22)[:3]))
          with open("/tmp/meta.txt","w",encoding="utf-8") as f:
              bits=[b for b in [media,year] if b]
              f.write("  •  ".join(bits) or "DESTAQUE")
          with open("/tmp/overview.txt","w",encoding="utf-8") as f:
              f.write("\n".join(textwrap.wrap(overview or "Confira este destaque selecionado para você.", 30)[:5]))
          with open("/tmp/cta.txt","w",encoding="utf-8") as f:
              f.write("  •  ".join([x for x in [end_text,end_contact] if x])[:160])
          PY

          python - <<'PY'
          from PIL import Image, ImageDraw
          w,h=440,880
          img=Image.new("RGBA",(w,h),(0,0,0,0))
          d=ImageDraw.Draw(img)
          d.rounded_rectangle((5,5,w-5,h-5),radius=58,fill=(3,7,12,250),outline=(214,225,233,255),width=8)
          d.rounded_rectangle((18,18,w-18,h-18),radius=46,outline=(68,86,100,255),width=3)
          d.rounded_rectangle((145,24,295,48),radius=12,fill=(48,58,67,255))
          d.rounded_rectangle((0,185,8,295),radius=4,fill=(180,192,200,255))
          d.rounded_rectangle((432,220,440,350),radius=4,fill=(180,192,200,255))
          d.rounded_rectangle((150,842,290,852),radius=5,fill=(110,123,132,255))
          img.save("/tmp/phone-frame.png")
          PY

      - name: Render cinematic NEXUS template
        id: render
        shell: bash
        run: |
          set -euo pipefail
          echo template_render_failed > /tmp/nexus-render-error.txt
          SRC_DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/source.mp4 | head -n1)"
          export SRC_DUR
          RENDER_DUR="$SRC_DUR"
          export RENDER_DUR
          RENDER_ARGS=(--source /tmp/source.mp4 --output /tmp/rendered.mp4 --work /tmp/movie-template)
          if [ -s /tmp/logo.png ]; then
            RENDER_ARGS+=(--logo /tmp/logo.png)
          fi
          /usr/bin/python3 scripts/render_video_template.py "${RENDER_ARGS[@]}"
          test -s /tmp/rendered.mp4

      - name: Upload rendered video to NEXUS
        shell: bash
        run: |
          set -euo pipefail
          echo result_upload_failed > /tmp/nexus-render-error.txt
          SIZE="$(stat -c%s /tmp/rendered.mp4)"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/rendered.mp4 | head -n1)"
          if [ "$SIZE" -le $((90*1024*1024)) ]; then
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -A "NEXUS-GitHub-Renderer/1.0" \
              -X PUT "$NEXUS_BASE_URL/api/internal/video-render/upload" \
              -H "x-nexus-job-id: $JOB_ID" \
              -H "x-nexus-client-id: $CLIENT_ID" \
              -H "x-nexus-callback-token: $CALLBACK_TOKEN" \
              -H "x-nexus-duration: $DURATION" \
              -H "content-type: video/mp4" \
              -H "content-length: $SIZE" \
              --data-binary @/tmp/rendered.mp4
          else
            python scripts/upload_render.py
          fi

      - name: Report render failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/nexus-render-error.txt')
          error=path.read_text().strip() if path.exists() else 'github_template_render_failed'
          json.dump({'error':error},open('/tmp/failure.json','w'))
          PY
          curl --silent --show-error \
            -X POST "$NEXUS_BASE_URL/api/internal/video-render/fail" \
            -H "x-nexus-job-id: $JOB_ID" \
            -H "x-nexus-client-id: $CLIENT_ID" \
            -H "x-nexus-callback-token: $CALLBACK_TOKEN" \
            -H "content-type: application/json" \
            --data-binary @/tmp/failure.json
