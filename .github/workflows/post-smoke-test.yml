name: Post smoke test diagnostics

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - ".github/workflows/post-smoke-test.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Worker deploy and cron
        run: sleep 75

      - name: Read Claire and Ragnar smoke-test results
        shell: bash
        run: |
          set -euo pipefail
          URL="https://servidor-nexus.diamantehinode2015.workers.dev/health"

          for attempt in 1 2 3 4 5 6; do
            echo "Attempt $attempt"
            BODY="$(curl -fsS --max-time 20 "$URL" || true)"
            if [ -n "$BODY" ]; then
              echo "$BODY" | jq '{ok, service, postSmokeTests}'
              COUNT="$(echo "$BODY" | jq -r '(.postSmokeTests // []) | length' 2>/dev/null || echo 0)"
              if [ "$COUNT" -ge 2 ]; then
                exit 0
              fi
            fi
            sleep 20
          done

          echo "Smoke-test results were not available after waiting for cron."
          exit 1
