name: Materialize NEXUS Android Platform

on:
  push:
    branches:
      - feature/nexus-app-v2-20260924
    paths:
      - ".github/workflows/materialize-nexus-android.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/nexus-app-v2-20260924
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform once
        working-directory: apps/nexus_app
        run: flutter create --platforms=android .

      - name: Ensure Internet permission and NEXUS label
        working-directory: apps/nexus_app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
              )
          s = s.replace('android:label="nexus_app"', 'android:label="NEXUS AI"')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit versioned Android platform
        shell: bash
        run: |
          git config user.name "NEXUS CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/nexus_app/android
          if git diff --cached --quiet; then
            echo "Android platform already versioned."
            exit 0
          fi
          git commit -m "build(android): version native platform"
          git push origin HEAD:feature/nexus-app-v2-20260924
