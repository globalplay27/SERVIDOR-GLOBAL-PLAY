name: Build NEXUS AI Master Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop-master/**"
      - ".github/workflows/build-nexus-master-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore desktop-master/NexusAI.Master/NexusAI.Master.csproj

      - name: Publish Windows x64
        run: dotnet publish desktop-master/NexusAI.Master/NexusAI.Master.csproj -c Release -r win-x64 --self-contained true -o desktop-master/publish

      - name: Smoke test Master startup
        shell: powershell
        run: |
          $exe = Resolve-Path "desktop-master/publish/NexusAIMaster.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "NEXUS AI Master\startup.log"
            if (Test-Path $log) { Get-Content $log }
            throw "NEXUS AI MASTER exited during startup smoke test with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "desktop-master\installer.iss"'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-MASTER-Windows
          path: desktop-master/output/NEXUS-AI-MASTER-Setup.exe
          if-no-files-found: error