name: Deploy Nexus Worker

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexus-app-v2-20260924
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-nexus-worker.yml"

concurrency:
  group: nexus-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository/environment secret CLOUDFLARE_API_TOKEN"
            exit 2
          fi

      - name: Discover Cloudflare Account ID
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          account_id=$(node -e '
            const d=JSON.parse(process.argv[1]);
            if(!d.success) process.exit(2);
            const rows=Array.isArray(d.result)?d.result:[];
            if(rows.length!==1){
              console.error("Expected exactly one accessible Cloudflare account, found "+rows.length);
              process.exit(3);
            }
            process.stdout.write(rows[0].id);
          ' "$response")
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Cloudflare account discovered successfully."

      - name: Diagnose Global Play site resources
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== GLOBALPLAY WORKER SETTINGS ==="
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/globalplay-site/settings" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s); if(!j.success){console.error(JSON.stringify(j.errors||j));process.exit(2);}
              const r=j.result||{};
              console.log(JSON.stringify({
                bindings:(r.bindings||[]).map(b=>({name:b.name,type:b.type,id:b.id||b.namespace_id||b.bucket_name||null})),
                compatibility_date:r.compatibility_date||null,
                compatibility_flags:r.compatibility_flags||[]
              },null,2));
            });
          '

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Validate Worker bundle
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run check

      - name: Deploy NEXUS Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy Global Play site from standalone repository
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/globalplay27/globalplay-site.git globalplay-site
          cd globalplay-site
          node --check src/index.js
          response=$(curl -fsS -X PUT             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/globalplay-site/content"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -F 'metadata={"main_module":"index.js"};type=application/json'             -F 'files=@src/index.js;filename=index.js;type=application/javascript+module')
          node -e '
            const d=JSON.parse(process.argv[1]);
            if(!d.success){console.error(JSON.stringify(d.errors||d));process.exit(2);}
            console.log("Global Play Worker uploaded successfully.");
          ' "$response"

      - name: Verify Global Play SEO live
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            html=$(curl -fsSL --max-time 20 https://globalplay.fun/ || true)
            if echo "$html" | grep -q 'https://globalplay.fun/' && echo "$html" | grep -q 'application/ld+json'; then
              echo "Global Play home SEO verified."
              break
            fi
            sleep 5
          done
          html=$(curl -fsSL --max-time 20 https://globalplay.fun/)
          echo "$html" | grep -q '<link rel="canonical" href="https://globalplay.fun/">'
          echo "$html" | grep -q 'application/ld+json'
          curl -fsSL --max-time 20 https://globalplay.fun/robots.txt | grep -q 'Sitemap: https://globalplay.fun/sitemap.xml'
          curl -fsSL --max-time 20 https://globalplay.fun/sitemap.xml | grep -q '<loc>https://globalplay.fun/</loc>'
          echo "Global Play live validation passed."
