name: Nexus protected test-post probe

on:
  push:
    branches:
      - feature/nexus-app-v2-20260924
    paths:
      - ".github/workflows/nexus-protected-test-post.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Discover Cloudflare account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          account_id=$(node -e '
            const d=JSON.parse(process.argv[1]);
            const rows=Array.isArray(d.result)?d.result:[];
            if(!d.success || rows.length!==1) process.exit(2);
            process.stdout.write(rows[0].id);
          ' "$response")
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Install Wrangler
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Set one-time Worker secret
        working-directory: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          printf '%s' "$key" | npx wrangler secret put NEXUS_TEST_PUBLISH_KEY
          echo "TEST_KEY=$key" >> "$GITHUB_ENV"

      - name: List prepared posts
        shell: bash
        env:
          TEST_KEY: ${{ env.TEST_KEY }}
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer $TEST_KEY"             -H "Content-Type: application/json"             -d '{"action":"list"}'             "https://servidor-nexus.diamantehinode2015.workers.dev/api/internal/test-post-control"
