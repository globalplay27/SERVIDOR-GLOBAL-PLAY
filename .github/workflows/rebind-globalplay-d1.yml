name: Rebind Global Play D1

on:
  push:
    branches:
      - feature/nexus-app-v2-20260924
    paths:
      - ".github/workflows/rebind-globalplay-d1.yml"

jobs:
  rebind:
    runs-on: ubuntu-latest
    steps:
      - name: Discover Cloudflare account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          account_id=$(node -e 'const d=JSON.parse(process.argv[1]); const r=d.result||[]; if(!d.success||r.length!==1)process.exit(2); process.stdout.write(r[0].id)' "$response")
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Rebind DB and upload site code
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          git clone --depth 1 https://github.com/globalplay27/globalplay-site.git globalplay-site
          cd globalplay-site
          node --check src/index.js
          python - <<'PY'
          import json, os, requests
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_API_TOKEN"].strip()
          headers={"Authorization": f"Bearer {token}"}

          settings_url=f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/globalplay-site/settings"
          files=[
            ("settings", (None, json.dumps({
              "bindings":[
                {
                  "type":"d1",
                  "name":"DB",
                  "database_id":"e08d1f7a-ab42-4070-a6ef-41ca1527c036"
                }
              ]
            }), "application/json"))
          ]
          r=requests.patch(settings_url, headers=headers, files=files, timeout=60)
          print("SETTINGS_STATUS",r.status_code)
          print(r.text)
          if not r.ok or not r.json().get("success"):
            raise SystemExit(2)

          content_url=f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/globalplay-site/content"
          with open("src/index.js","rb") as fh:
              files=[
                ("metadata",(None,json.dumps({"main_module":"index.js"}),"application/json")),
                ("files",("index.js",fh,"application/javascript+module"))
              ]
              r=requests.put(content_url,headers=headers,files=files,timeout=60)
          print("CONTENT_STATUS",r.status_code)
          print(r.text)
          if not r.ok or not r.json().get("success"):
              raise SystemExit(2)
          PY

      - name: Bootstrap and verify
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o setup.html -w "%{http_code}" --max-time 20 https://globalplay-site.diamantehinode2015.workers.dev/setup || true)
            echo "setup status=$code"
            if [ "$code" = "200" ]; then break; fi
            sleep 3
          done
          grep -q "Criar administrador" setup.html
          curl -fsSL --max-time 20 https://globalplay-site.diamantehinode2015.workers.dev/admin/login | grep -q "Entrar no painel"
          curl -fsSL --max-time 20 https://globalplay-site.diamantehinode2015.workers.dev/ | grep -q "Global Play"
          echo "Global Play D1 rebind and bootstrap OK."
