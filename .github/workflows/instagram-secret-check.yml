name: Instagram secret validation

on:
  push:
    branches: [cloudflare-migration]
    paths:
      - ".github/workflows/instagram-secret-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for cron validation
        run: sleep 75
      - name: Read sanitized Instagram validation
        shell: bash
        run: |
          set -euo pipefail
          URL="https://servidor-nexus.diamantehinode2015.workers.dev/health"
          for attempt in 1 2 3 4 5; do
            BODY="$(curl -fsS --max-time 20 "$URL" || true)"
            if [ -n "$BODY" ]; then
              echo "$BODY" | jq '{ok,instagramSecretCheck}'
              COUNT="$(echo "$BODY" | jq -r '(.instagramSecretCheck // []) | length' 2>/dev/null || echo 0)"
              if [ "$COUNT" -ge 2 ]; then exit 0; fi
            fi
            sleep 20
          done
          exit 1
