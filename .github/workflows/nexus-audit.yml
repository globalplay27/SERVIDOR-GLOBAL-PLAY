name: Nexus read-only production audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nexus-audit.yml
      - .github/scripts/nexus-audit.mjs
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wrangler
        working-directory: cloudflare
        run: npm install --no-audit --no-fund
      - name: Read sanitized D1 operational state
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9ecb78dbc0c1b0b61f8caae501f59df
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare token unavailable"
            exit 1
          fi
          node ../.github/scripts/nexus-audit.mjs

