name: Legacy Branch Cloudflare Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/continuous-cloudflare-test.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poll Worker
        shell: bash
        run: |
          set -euo pipefail
          URL="https://servidor-nexus.diamantehinode2015.workers.dev/health"
          for attempt in $(seq 1 18); do
            BODY="$(curl -fsS --max-time 20 "$URL" || true)"
            echo "attempt=$attempt"
            echo "$BODY" | jq '{ok,runtime,releaseMarker,openai}' || true
            if [ "$(echo "$BODY" | jq -r '.releaseMarker // empty' 2>/dev/null)" = "2026-09-25-migration-test-4" ]; then
              echo "DEPLOY_OK"
              exit 0
            fi
            sleep 10
          done
          echo "DEPLOY_NOT_SEEN"
          exit 1
