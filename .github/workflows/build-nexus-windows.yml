name: Build NEXUS AI Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-nexus-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore desktop/NexusAI.Desktop/NexusAI.Desktop.csproj

      - name: Publish Windows x64
        run: dotnet publish desktop/NexusAI.Desktop/NexusAI.Desktop.csproj -c Release -r win-x64 --self-contained true -o desktop/publish

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "desktop\installer.iss"'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-Windows
          path: desktop/output/NEXUS-AI-Setup.exe
          if-no-files-found: error
