name: NEXUS YouTube Smoke

on:
  push:
    paths:
      - ".github/workflows/video-youtube-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install yt-dlp and PO token provider
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet --upgrade "yt-dlp[default]" bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 2.0.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm ci --silent
          npx tsc
      - name: Test YouTube with generated PO token
        shell: bash
        env:
          URL: https://www.youtube.com/watch?v=WlpK6_BDNgE
        run: |
          set -euo pipefail
          yt-dlp \
            --js-runtimes node \
            --no-playlist \
            --extractor-args "youtube:player-client=mweb,tv,web_safari;youtubepot-bgutilscript:server_home=/tmp/bgutil/server" \
            -f "b[height<=720]/b" \
            -g "$URL" | tee /tmp/result.txt
          test -s /tmp/result.txt
