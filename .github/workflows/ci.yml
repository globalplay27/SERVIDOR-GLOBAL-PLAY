name: NEXUS CI

on:
  push:
    branches: [main, cloudflare-migration]
  pull_request:

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check panel JavaScript
        run: |
          node --check public/app.js
          node --check public/client-lite.js

      - name: Check Cloudflare Worker syntax
        shell: bash
        run: |
          for file in cloudflare/src/*.js; do
            node --check "$file"
          done

      - name: Validate Wrangler bundle
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          npm run check

      # Production deploy is automatic on main when the repository already has
      # CLOUDFLARE_API_TOKEN configured as an Actions secret. The account ID is public metadata.
      # Pull requests and migration branches remain validation-only.
      - name: Deploy servidor-nexus to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9ecb78dbc0c1b0b61f8caae501f59df
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare deploy blocked: CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deploy blocked: CLOUDFLARE_ACCOUNT_ID is not configured."
            echo "::error::CI must not report success when production was not deployed."
            exit 1
          fi
          npm run deploy
