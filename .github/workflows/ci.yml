name: NEXUS CI

on:
  push:
    branches: [main, cloudflare-migration, feature/nexus-app-v2-20260924]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check server syntax
        run: node --check server.js
      - name: Check intelligence layer syntax
        run: node --check instagram-intelligence.js
      - name: Check client syntax
        run: node --check public/client.js
      - name: Check Cloudflare Worker syntax
        shell: bash
        run: |
          for file in cloudflare/src/*.js; do
            node --check "$file"
          done
