name: NEXUS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check server syntax
        run: node --check server.js
      - name: Check intelligence layer syntax
        run: node --check instagram-intelligence.js
      - name: Check client syntax
        run: node --check public/client.js
